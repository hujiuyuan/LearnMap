name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: learnmap
          MYSQL_USER: learnmap
          MYSQL_PASSWORD: learnmap
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 单元测试和集成测试（H2）
        run: mvn -B verify
      - name: 在 MySQL 8 上跑一遍迁移和演示数据
        run: |
          java -jar target/learnmap-server-*.jar --spring.profiles.active=mysql --learnmap.demo.enabled=true > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat app.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 编译 H5
        run: npm run build:h5
